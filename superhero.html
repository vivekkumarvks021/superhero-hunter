<!doctype html>
<html lang="en">
  <head>
    <!-- Basic page setup -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser tab title -->
    <title>Superhero Details</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Page header -->
    <header class="page-header">
      <h1>Superhero Details</h1>

      <!-- Link to go back to home page -->
      <a href="./index.html" class="back-link">← Back to Home</a>
    </header>

    <main class="details-page-container">
      <!-- Loading text shown while superhero details are being fetched -->
      <p id="detailsLoading" class="loading hidden">
        Loading superhero details...
      </p>

      <!-- Superhero details will be rendered here using JavaScript -->
      <section id="heroDetails" class="hero-details-container">
        <!-- JS se details render hongi -->
      </section>
    </main>

    <!-- JavaScript files -->
    <!-- config.js -> stores API token and base URL -->
    <script src="./js/config.js"></script>

    <!-- api.js -> contains API functions for superhero data -->
    <script src="./js/api.js"></script>

    <!-- storage.js -> handles localStorage related utility functions -->
    <script src="./js/storage.js"></script>

    <!-- superhero.js -> fetches hero details and renders them on this page -->
    <script src="./js/superhero.js"></script>
  </body>
</html>
